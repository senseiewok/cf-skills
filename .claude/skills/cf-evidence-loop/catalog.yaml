  - id: ukcfr-adr-2024
    title: UK Cystic Fibrosis Registry Annual Data Report 2024
    publisher: Cystic Fibrosis Trust
    kind: registry_annual_report
    data_year: 2024
    access: fetch
    robots: allow
    robots_checked: 2026-10-05
    landing_page: https://www.cysticfibrosis.org.uk/about-us/uk-cf-registry/reporting-and-resources
    url: https://www.cysticfibrosis.org.uk/sites/default/files/2025-12/2024%20Registry%20Report%20v2.pdf
    filename: UKCFR_Annual_Data_Report_2024_v2.pdf
    pages: 100
    text_layer: embedded
    claim_label: verified
    notes: >-
      Read 2026-10-05: robots.txt first, one request, 200, a PDF. Title page: "UK Cystic Fibrosis Registry
      2024 Annual Data Report", dated October 2025; version 2 (November 2025) corrects figure 3.9 on page 70.
      Usable text layer. The report's copyright notice says that using or reproducing its content in
      publications needs the permission of the Cystic Fibrosis Trust. So the lab reads and cites it, links to
      it, and does not re-host it or reproduce its tables (redistribute stays false); reuse in a
      publication needs the Trust's written permission. The landing page also lists an at-a-glance
      summary, a Scottish report and older years, none of which are catalogued yet. England, Wales,
      Scotland and Northern Ireland are covered; comparability with other registries is not assessed.

